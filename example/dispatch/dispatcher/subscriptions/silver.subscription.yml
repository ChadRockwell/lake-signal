apiVersion: v1
kind: subscription

variables:
  bronze_catalog:
    description: "Unity Catalog catalog where upstream data lives"
  bronze_schema:
    description: "Unity Catalog schema where upstream data lives"
  job_name:
    description: "Name of the downstream pipeline job to trigger"
    default: lakesignal_example_dispatch_silver_pipelines

name: silver
team: analytics
owners: [alice@company.com, charlie@company.com]
tags:
  domain: finance
  tier: silver

# Upstream is a single bronze DLT pipeline; completion covers all tables in that pipeline.
subscribe_to:
  - subject: pipeline
    subject_name: ${var.bronze_catalog}.${var.bronze_schema}.lakesignal_example_bronze_ingest
    action: completed

cooldown:
  period: 1d
  timezone: "America/New_York"

# Downstream work when dependencies are met. This example uses trigger.job
# (pipeline-only job that emits started/completed signals). Alternatives:
#   trigger.pipeline: lakesignal_example_dispatch_silver
#   trigger.materialized_view: <catalog>.<schema>.<view>
trigger:
  job: ${var.job_name}

targets:
  dev:
    default: true
    variables:
      bronze_catalog: charoc_serverless_catalog
      bronze_schema: lakesignal_example
      job_name: lakesignal_example_dispatch_silver_pipelines
  prod:
    variables:
      bronze_catalog: prod_catalog
      bronze_schema: lakesignal_example
      job_name: lakesignal_example_dispatch_silver_pipelines
