resources:
  jobs:
    pipeline_emitter:
      name: lakesignal_pipeline_emitter

      environments:
        - environment_key: serverless
          spec:
            environment_version: "3"
            dependencies:
              - /Volumes/${var.lakesignal_catalog}/${var.lakesignal_schema}/lakesignal/libs/lakesignal_pipeline_emitter-0.1.0-py3-none-any.whl

      tasks:
        - task_key: emit_flow_signals
          environment_key: serverless
          python_wheel_task:
            package_name: lakesignal_pipeline_emitter
            entry_point: lakesignal-pipeline-emitter
            named_parameters:
              lakesignal_catalog: ${var.lakesignal_catalog}
              lakesignal_schema: ${var.lakesignal_schema}
              env: ${var.env}
      schedule:
        quartz_cron_expression: "0 0/5 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
