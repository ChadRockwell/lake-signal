apiVersion: v1
kind: subscription

variables:
  silver_catalog:
    description: "Unity Catalog catalog where the silver pipeline lives"
  silver_schema:
    description: "Unity Catalog schema where the silver pipeline lives"

name: inline_gold
team: data_products
owners: [bob@company.com]

# Gold depends on the inline silver pipeline completing.
subscribe_to:
  - subject: pipeline
    subject_name: ${var.silver_catalog}.${var.silver_schema}.lakesignal_example_inline_silver
    action: completed

cooldown:
  period: 1d
  timezone: "UTC"

targets:
  dev:
    default: true
    variables:
      silver_catalog: charoc_serverless_catalog
      silver_schema: lakesignal_example
